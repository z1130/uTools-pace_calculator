name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # 打包构建产物（dist 内含 plugin.json，解压即可作为 uTools 插件使用）
      - name: Zip dist
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist && zip -r "../pace-calculator-${{ github.ref_name }}.zip" . && cd ..

      # 取当前 tag 指向 commit 的完整 message 作为 release notes
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: git log -1 --pretty=%B > release_notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pace-calculator-${{ github.ref_name }}.zip
          body_path: release_notes.md
